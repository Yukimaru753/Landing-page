<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing-page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- いらない→flexbox-columnでheader-topとheader-mainを縦に並べる -->
     <!-- header-topとheader-mainはどちらもblock要素だからflexboxを使わなくても最初から縦に並ぶ -->
    <div class="header">
      <!-- flexboxでheader-logoとheader-linkを横並びにする-->
      <header class="header-top">
        <div class="header-logo">Header Logo</div>
        <a class="header-link" href="./header-link-one/one.html"
          >header link one</a
        >
        <a class="header-link" href="./header-link-two/two.html"
          >header link two</a
        >
        <a class="header-link" href="./header-link-three/three.html"
          >header link three</a
        >
      </header>
      <!-- flexboxでheader-main-textsとheader-main-imageを横並びにする -->
      <div class="header-main">
        <!-- いらない→flexboxでtitle,subtitle,buttonを縦の並びで管理 -->
         <!-- block要素なので最初から縦に並ぶ。あとでまとめて管理したい(gapとか)なら使ってもいい -->
        <div class="header-main-texts">
          <h1 class="header-main-title">This website is awesome</h1>
          <p class="header-main-subtext">
            This website has some subtext that goes here under the main title.
            It's a smaller font and the color is lower contrast.
          </p>
          <button class="header-main-button">Sign up</button>
        </div>
        <img
          class="header-main-image"
          src="./pictures/image1.png"
          alt="image"
          height="200"
          width="400"
        />
      </div>
    </div>
  </body>
</html>
